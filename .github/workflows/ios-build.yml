name: iOS Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -project MindSpend.xcodeproj \
            -scheme MindSpend \
            -destination "generic/platform=iOS Simulator"

      - name: Find available iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("iOS"))
              | .value[]
              | select(.name | contains("iPhone"))
            ] | .[0].udid // empty
          ')
          if [ -z "$UDID" ]; then
            echo "No available iOS Simulator found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -project MindSpend.xcodeproj \
            -scheme MindSpendTests \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
