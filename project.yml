name: MindSpend
options:
  bundleIdPrefix: com.anpause
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # NOT: Team ID (2ZH4RCM3MU) burada bilerek boş bırakılıyor. Simulator'da
    # build+test alan CI, DEVELOPMENT_TEAM dolu olduğunda Xcode'un otomatik
    # imzalama yöneticisini Apple'a bağlanmaya zorlayabilir (CI'da giriş
    # yapılmış bir Apple ID yok) ve şu an yeşil olan build/test'i kırma
    # riski taşır. Team ID, TestFlight dağıtımı fastlane match ile kurulunca
    # o adımda (Fastfile/Matchfile içinde) kullanılacak.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0

targets:
  MindSpend:
    type: application
    platform: iOS
    sources:
      - path: MindSpend
        excludes:
          - "Tests/**"
    info:
      path: MindSpend/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: AnPause
    entitlements:
      path: MindSpend/App/MindSpend.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.anpause.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpause.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShieldConfigurationExtension
        embed: true
      - target: ShieldActionExtension
        embed: true
      - target: DeviceActivityMonitorExtension
        embed: true
      - package: RevenueCat
        product: RevenueCat

  # Family Controls / ManagedSettingsUI / DeviceActivity extension'ları
  # (ShieldConfiguration/ShieldAction/DeviceActivityMonitor) iOS Simulator'da
  # kurulamaz (Apple, Screen Time API'lerini yalnızca gerçek cihazda
  # destekler — bkz. rehber madde 35, 49). Bu yüzden unit testler,
  # extension embed etmeyen ayrı bir "test host" app'te çalıştırılır.
  # Gerçek cihaz/TestFlight için asıl `MindSpend` hedefi (extension'lı)
  # kullanılmaya devam eder.
  MindSpendTestHost:
    type: application
    platform: iOS
    sources:
      - path: MindSpend
        excludes:
          - "Tests/**"
    info:
      path: MindSpend/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MindSpend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpause.app.testhost
        TARGETED_DEVICE_FAMILY: "1"
        # Test dosyaları `@testable import MindSpend` kullanıyor; bu host'un
        # derlenen modül adı da "MindSpend" olmalı, yoksa tüm app tipleri
        # (Money, Transaction, ...) link aşamasında "Undefined symbol" olarak
        # başarısız olur.
        PRODUCT_MODULE_NAME: MindSpend
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  MindSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MindSpend/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpause.app.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MindSpendTestHost.app/MindSpendTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MindSpendTestHost

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
      - path: MindSpend/ScreenTime/Shared
    info:
      path: Extensions/ShieldConfiguration/Info.plist
    entitlements:
      path: Extensions/Shared.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.anpause.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpause.app.ShieldConfiguration
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: MindSpend/ScreenTime/Shared
    info:
      path: Extensions/ShieldAction/Info.plist
    entitlements:
      path: Extensions/Shared.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.anpause.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpause.app.ShieldAction
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: MindSpend/ScreenTime/Shared
    info:
      path: Extensions/DeviceActivityMonitor/Info.plist
    entitlements:
      path: Extensions/Shared.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.anpause.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anpause.app.DeviceActivityMonitor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

schemes:
  MindSpend:
    build:
      targets:
        MindSpend: all
    run:
      config: Debug

  MindSpendTests:
    build:
      targets:
        MindSpendTestHost: all
        MindSpendTests: [test]
    test:
      targets:
        - MindSpendTests
    run:
      config: Debug
