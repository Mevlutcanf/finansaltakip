name: MindSpend
options:
  bundleIdPrefix: com.mindspend
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0

targets:
  MindSpend:
    type: application
    platform: iOS
    sources:
      - path: MindSpend
        excludes:
          - "Tests/**"
    info:
      path: MindSpend/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MindSpend
    entitlements:
      path: MindSpend/App/MindSpend.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mindspend.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShieldConfigurationExtension
        embed: true
      - target: ShieldActionExtension
        embed: true
      - target: DeviceActivityMonitorExtension
        embed: true
      - package: RevenueCat
        product: RevenueCat

  MindSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MindSpend/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MindSpend

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
      - path: MindSpend/ScreenTime/Shared
    info:
      path: Extensions/ShieldConfiguration/Info.plist
    entitlements:
      path: Extensions/Shared.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mindspend.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app.ShieldConfiguration
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: MindSpend/ScreenTime/Shared
    info:
      path: Extensions/ShieldAction/Info.plist
    entitlements:
      path: Extensions/Shared.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mindspend.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app.ShieldAction
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: MindSpend/ScreenTime/Shared
    info:
      path: Extensions/DeviceActivityMonitor/Info.plist
    entitlements:
      path: Extensions/Shared.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mindspend.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app.DeviceActivityMonitor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

schemes:
  MindSpend:
    build:
      targets:
        MindSpend: all
        MindSpendTests: [test]
    test:
      targets:
        - MindSpendTests
    run:
      config: Debug
