name: MindSpend
options:
  bundleIdPrefix: com.mindspend
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MindSpend:
    type: application
    platform: iOS
    sources:
      - path: MindSpend
        excludes:
          - "Tests/**"
    info:
      path: MindSpend/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MindSpend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

  MindSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MindSpend/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindspend.app.Tests
    dependencies:
      - target: MindSpend

schemes:
  MindSpend:
    build:
      targets:
        MindSpend: all
        MindSpendTests: [test]
    test:
      targets:
        - MindSpendTests
    run:
      config: Debug
